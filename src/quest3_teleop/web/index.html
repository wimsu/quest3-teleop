<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quest 3 Teleop</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101318; color: #f4f7fb; }
      main { width: min(36rem, 88vw); text-align: center; }
      button { font: inherit; font-size: 1.4rem; font-weight: 650; padding: 1rem 1.5rem; border: 0; border-radius: .8rem; background: #5fc6ff; color: #06131b; }
      button:disabled { opacity: .45; }
      #status { margin-top: 1.4rem; line-height: 1.5; color: #c6d2dc; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="xr-canvas"></canvas>
    <main>
      <h1>Quest 3 Teleop</h1>
      <button id="start" disabled>Checking Quest...</button>
      <div id="status">Desktop connection: waiting</div>
    </main>
    <script type="module" src="/app.js?v=__QUEST3_ASSET_VERSION__"></script>
  </body>
</html>
